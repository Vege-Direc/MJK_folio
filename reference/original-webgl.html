  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Neural Network Scroll — Prototype<\u002Ftitle>\n\n\n<style>\n  :root{ color-scheme: dark; }\n  *{ box-sizing: border-box; }\n  html,body{ margin:0; padding:0; }\n  body{\n    background:#0a0a0e;\n    color:#eaf6ff;\n    font-family: ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto, Inter, sans-serif;\n    -webkit-font-smoothing: antialiased;\n    overflow-x:hidden;\n  }\n  #webgl-canvas{\n    position:fixed; inset:0; width:100vw; height:100vh;\n    display:block; z-index:0;\n  }\n  .scroll-root{ position:relative; z-index:1; }\n  section.panel{\n    height:100vh; height:100svh;\n    min-height:100vh;\n    display:flex; align-items:center; justify-content:center;\n    padding: 8vh 6vw;\n  }\n  .section-inner{\n    max-width: 56ch; width:100%;\n    text-align:center;\n    background: linear-gradient(180deg, rgba(8,12,18,.70), rgba(8,12,18,.44));\n    border:1px solid rgba(120,180,220,.18);\n    border-radius:18px;\n    padding: clamp(1.4em,3vw,2.2em) clamp(1.2em,4vw,2em);\n    backdrop-filter: blur(12px);\n    -webkit-backdrop-filter: blur(12px);\n    box-shadow: 0 12px 44px rgba(0,0,0,.4);\n    opacity:.32;\n    transform: translateY(8px) scale(.985);\n    transition: opacity .5s cubic-bezier(.2,0,0,1), transform .5s cubic-bezier(.2,0,0,1);\n  }\n  .section-inner.active{\n    opacity:1; transform: none;\n  }\n  .section-kicker{\n    color:#3ecfff; letter-spacing:.24em; text-transform:uppercase;\n    font-size:.76rem; font-weight:600; margin:0 0 .6em;\n  }\n  .section-title{\n    font-size: clamp(1.7rem,4.4vw,3rem); line-height:1.05;\n    margin:0 0 .5em; font-weight:700; letter-spacing:-.01em;\n  }\n  .section-body{\n    color:#9fc4d8; font-size: clamp(1rem,1.6vw,1.12rem);\n    line-height:1.6; margin:0;\n  }\n  #hud{\n    position:fixed; top:14px; left:14px; z-index:5;\n    display:flex; gap:8px; align-items:center; pointer-events:none; flex-wrap:wrap;\n    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n    font-size:12px; color:#9fc4d8;\n  }\n  .badge{\n    background:rgba(10,14,20,.55); border:1px solid rgba(120,180,220,.18);\n    border-radius:8px; padding:5px 9px; backdrop-filter:blur(6px);\n    -webkit-backdrop-filter:blur(6px); white-space:nowrap;\n  }\n  #fps{ color:#3ecfff; font-weight:700; }\n  #node-label{ color:#eaf6ff; }\n  #scroll-hint{\n    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);\n    z-index:5; color:#9fc4d8; font-size:.76rem; letter-spacing:.18em;\n    text-transform:uppercase; pointer-events:none;\n    background:rgba(10,14,20,.55); border:1px solid rgba(120,180,220,.18);\n    border-radius:999px; padding:7px 14px; backdrop-filter:blur(6px);\n    -webkit-backdrop-filter:blur(6px); transition:opacity .4s;\n  }\n  #scroll-hint.fade{ opacity:0; }\n  #webgl-fallback{\n    position:fixed; inset:0; z-index:10; display:none;\n    align-items:center; justify-content:center; text-align:center; padding:2em;\n    color:#9fc4d8; background:#0a0a0e;\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  <canvas id=\"webgl-canvas\" data-od-id=\"neural-canvas\"><\u002Fcanvas>\n\n  <div id=\"hud\" aria-hidden=\"true\">\n    <span class=\"badge\">FPS <span id=\"fps\">--<\u002Fspan><\u002Fspan>\n    <span class=\"badge\" id=\"node-label\" data-od-id=\"node-label\">node 0 · establishing<\u002Fspan>\n    <span class=\"badge\" id=\"tier-label\">desktop<\u002Fspan>\n  <\u002Fdiv>\n  <div id=\"scroll-hint\">scroll to travel the network<\u002Fdiv>\n\n  <div id=\"webgl-fallback\">\n    <div>\n      <h2 style=\"color:#eaf6ff\">WebGL unavailable<\u002Fh2>\n      <p>This prototype needs WebGL. Try a recent desktop or mobile browser with hardware acceleration on.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <main class=\"scroll-root\" id=\"scroll-root\"><\u002Fmain>\n\n  <script src=\"5aa898f4-ece4-47df-92f9-67a87ada1f99\"><\u002Fscript>\n  <script src=\"ea165295-0816-45b2-b9da-22e212ca50b9\"><\u002Fscript>\n\n  <script type=\"importmap\">\n  {\n    \"imports\": {\n      \"three\": \"https://unpkg.com/three@0.169.0/build/three.module.js\",\n      \"three/addons/\": \"https://unpkg.com/three@0.169.0/examples/jsm/\"\n    }\n  }\n  <\u002Fscript>\n\n  <script type=\"module\">\n  import * as THREE from 'three';\n  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';\n  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';\n  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';\n  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';\n  import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';\n\n  const gsap = window.gsap;\n  const ScrollTrigger = window.ScrollTrigger;\n  if (gsap && ScrollTrigger) gsap.registerPlugin(ScrollTrigger);\n\n  const PALETTE = {\n    bg: 0x0a0a0e,\n    node: 0x3ecfff,\n    nodeAccent: 0xff8a3d,\n    tube: 0x2a8fb8,\n    particle: 0xbff7ff,\n  };\n\n  const UP = new THREE.Vector3(0, 1, 0);\n  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n  const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };\n\n  function mulberry32(a){\n    return function(){\n      a |= 0; a = a + 0x6D2B79F5 | 0;\n      let t = Math.imul(a ^ a >>> 15, 1 | a);\n      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;\n      return ((t ^ t >>> 14) >>> 0) / 4294967296;\n    };\n  }\n  const srand = (s) => { const x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };\n\n  // Multi-scale tortuosity: real dendrites/axons MEANDER across multiple scales\n  // (Wen & Chklovskii 2008; Frontiers Network Physiology 2023 — tortuosity T\n  // quantifies the meandering nature of dendrites). A single quadratic bend reads\n  // as one smooth arc; real neurites wander. We lay N intermediate waypoints along\n  // A->B, each offset perpendicular to the curve direction by srand-based amounts\n  // at decreasing scale, then build a CatmullRomCurve3 through them => organic\n  // wandering at multiple frequencies, not a single bow.\n  // CONSTRAINT: offsets depend on (dir, len, seed) ONLY, never absolute A/B, so\n  // makeCurve(S[i],S[i+1],seed) and makeCurve(V[i],V[i+1],seed) (V=S+up) produce the\n  // IDENTICAL meander (dir identical => perp1/perp2 identical => offsets identical)\n  // => the camera curve is the tube curve shifted up => camera still travels ALONG\n  // the axon. No absolute-position noise (that would desync camera from tube).\n  function makeCurve(a, b, seed){\n    const dir = b.clone().sub(a);\n    const len = dir.length() || 1;\n    const nrm = dir.clone().normalize();\n    let perp1 = new THREE.Vector3().crossVectors(nrm, UP);\n    if (perp1.lengthSq() < 1e-4) perp1 = new THREE.Vector3(1, 0, 0);\n    perp1.normalize();\n    const perp2 = new THREE.Vector3().crossVectors(nrm, perp1).normalize();\n    const pts = [a.clone()];\n    const N = 4;\n    const maxBend = Math.min(len * 0.16, 1.7);\n    for (let k = 1; k <= N; k++){\n      const t = k / (N + 1);\n      const p = a.clone().addScaledVector(dir, t);\n      // decreasing-scale offsets: coarse wander (low k) + fine jitter (high k)\n      const scale = 1.0 / (0.6 + k * 0.7);\n      const amp = maxBend * scale * (0.45 + srand(seed + k * 7.3) * 0.9);\n      const ang = srand(seed + k * 3.1) * Math.PI * 2;\n      p.addScaledVector(perp1, Math.cos(ang) * amp * (0.4 + srand(seed + k * 11.7) * 0.7));\n      p.addScaledVector(perp2, Math.sin(ang) * amp * (0.4 + srand(seed + k * 13.3) * 0.7));\n      pts.push(p);\n    }\n    pts.push(b.clone());\n    return new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);\n  }\n\n  const isMobile = (() => {\n    const ua = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);\n    const vw = window.innerWidth <= 768;\n    return ua || vw;\n  })();\n  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  const CFG = {\n    desktop: { secondaryPerNode: 5.5, bloom: true,  pulseCoverage: 1.0, pixelRatio: Math.min(window.devicePixelRatio || 1, 2),\n                tubeSeg: 64, tubeRad: 12, icoDetail: 3, nodeRadius: 0.5, tubeRadius: 0.045, fog: 0.020, bloomStrength: 0.45, bloomRadius: 0.85, bloomThreshold: 0.6, tubeCorePower: 2.0, axialFloor: 0.4,\n                // Node luminance tuned for eye comfort: lower white-peak + smaller glow\n                // radius + softer bloom reduce the high-luminance-on-near-black contrast\n                // that fatigues eyes (MDN luminance / dark-mode UX). Glow radius is a\n                // VISUAL metaphor, not medical (neurons emit no light) — sized for calm.\n                nodeCoreWhite: 0.32, nodeBody: 0.32, nodeSizeScale: 1.7,\n                pulseWidthRatio: 1.2, pulseElong: 1.15, pulseWidthEnd: 0.15, pulseOpacity: 1.0,\n                pulseSpeed: 0.36, pulseGap: 0.5, pulseTailSharp: 6.0, pulsePeak: 1.35,\n                exciteDecay: 6.3, refractory: 0.35,\n                triggerPulses: 20, triggerJitter: 1.2, triggerEarly: 0.5,\n                nebulaPoints: 9000, nebulaSize: 3.2, nebulaOpacity: 0.5, nebulaSpread: 5.0, nebulaDrift: 0.4, nebulaMouse: 10, nebulaMouseRadius: 7,\n                subBranchDepth: 3, subBranchProb: 0.80, subLenDecay: 0.66, subMaxNodes: 720, subPulseFrac: 0.30,\n                swayAmt: 0.5, swayFreq: 0.45,\n// Tier 2 (midground): growth-front seeds scattered just outside the\n                // soft camera corridor, grown with the SAME Galton-Watson logic +\n                // cfg values as the main sub-network (ambient-only: sway + shimmer\n                // + the same fractional subPulseFrac pulse coverage).\n                t2Seeds: 26, t2RadMin: 9, t2RadMax: 16, t2MaxNodes: 700,\n                // Tier 3 (far background): precomputed space colonization\n                // (far-network.json, built by tools/generate-far-network.mjs).\n                // Rendered through the SAME makeCurve / tubeWithTangent / tubeMat /\n                // nodeMat as tiers 1-2 — only the topology differs. Segment count =\n                // half of tier 2's (deliberate quality tier, NOT the old fixed 6).\n                t3SegScale: 0.4, t3Radial: 5, t3TubeRadius: 0.035, t3TrunkRadius: 0.11, t3NodeScale: 0.5,\n                t3PulseCount: 800, t3EdgeFrac: 1.0, t3AxialFloor: 0.62, t3Bright: 1.5,\n                t3Dust: 8000, t3DustSize: 2.6, t3DustSpread: 3.4, t3Accent: 0.24,\n                // soft corridor for tier-2 seeding: density *= smoothstep(inner, outer, distToPath)\n                corridorInner: 9, corridorOuter: 16 },\n    mobile:  { secondaryPerNode: 2.0, bloom: false, pulseCoverage: 0.8, pixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),\n                tubeSeg: 26, tubeRad: 5, icoDetail: 1, nodeRadius: 0.5, tubeRadius: 0.06,  fog: 0.030, bloomStrength: 0.0, bloomRadius: 0.85, bloomThreshold: 0.6, tubeCorePower: 1.6, axialFloor: 0.45,\n                // No bloom on mobile => the shader carries all the glow, so keep the\n                // white-peak a touch higher than desktop so nodes still read as light.\n                nodeCoreWhite: 0.42, nodeBody: 0.40, nodeSizeScale: 1.6,\n                pulseWidthRatio: 1.2, pulseElong: 1.15, pulseWidthEnd: 0.15, pulseOpacity: 1.0,\n                pulseSpeed: 0.30, pulseGap: 0.6, pulseTailSharp: 6.0, pulsePeak: 1.35,\n                exciteDecay: 6.3, refractory: 0.35,\n                triggerPulses: 12, triggerJitter: 1.0, triggerEarly: 0.4,\n                nebulaPoints: 2700, nebulaSize: 3.0, nebulaOpacity: 0.6, nebulaSpread: 4.0, nebulaDrift: 0.2, nebulaMouse: 7, nebulaMouseRadius: 6,\n                subBranchDepth: 2, subBranchProb: 0.72, subLenDecay: 0.7, subMaxNodes: 200, subPulseFrac: 0.28,\n                swayAmt: 0.35, swayFreq: 0.4,\nt2Seeds: 10, t2RadMin: 8, t2RadMax: 14, t2MaxNodes: 220,\n                t3SegScale: 0.4, t3Radial: 4, t3TubeRadius: 0.035, t3TrunkRadius: 0.1, t3NodeScale: 0.46,\n                t3PulseCount: 240, t3EdgeFrac: 0.55, t3AxialFloor: 0.62, t3Bright: 1.5,\n                t3Dust: 2600, t3DustSize: 2.4, t3DustSpread: 3.2, t3Accent: 0.24,\n                corridorInner: 8, corridorOuter: 14 },\n  };\n  const cfg = isMobile ? CFG.mobile : CFG.desktop;\n  document.getElementById('tier-label').textContent =\n    (isMobile ? 'mobile' : 'desktop') + (reducedMotion ? ' · reduced-motion' : '');\n\n  /**\n   * Neural scroll experience.\n   * @param {{canvas:HTMLCanvasElement, waypoints:{position:[x,y,z],lookAt:[x,y,z]}[],\n   *          onArriveAtNode?:(i:number)=>void, reducedMotion:boolean, isMobile:boolean, cfg:object}} opts\n   * @returns {{travelToNode:(i:number,duration?:number)=>void, destroy:()=>void,\n   *            getProgress:()=>number, getNode:()=>number, count:()=>number}}\n   */\n  function createNeuralScroll(opts){\n    const { canvas, waypoints, reducedMotion, isMobile, cfg } = opts;\n    const onArriveAtNodeCb = opts.onArriveAtNode || null;\n    const M = waypoints.length;\n    if (M < 2){ console.warn('[neural] need >=2 waypoints'); }\n\n    // Probe with attributes matching WebGLRenderer so the reused context keeps alpha:false + antialias setting.\n    // preserveDrawingBuffer: keeps the last frame readable for canvas capture\n    // (screenshots/thumbnails). Cost is one buffer copy — negligible on desktop;\n    // flip to false if mobile profiling ever shows it mattering.\n    const ctxAttrs = { antialias: !isMobile, alpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: true };\n    const testCtx = canvas.getContext('webgl2', ctxAttrs) || canvas.getContext('webgl', ctxAttrs);\n    if (!testCtx){\n      document.getElementById('webgl-fallback').style.display = 'flex';\n      return { travelToNode(){}, destroy(){}, getProgress:()=>0, getNode:()=>0, count:()=>M };\n    }\n\n    const rng = mulberry32(0x5eed ^ M);\n\n    const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile, alpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });\n    renderer.setPixelRatio(cfg.pixelRatio);\n    renderer.setSize(window.innerWidth, window.innerHeight, false);\n    renderer.toneMapping = THREE.NoToneMapping;\n    renderer.outputColorSpace = THREE.SRGBColorSpace;\n    renderer.setClearColor(PALETTE.bg, 1);\n\n    const scene = new THREE.Scene();\n    scene.background = new THREE.Color(PALETTE.bg);\n    scene.fog = new THREE.FogExp2(PALETTE.bg, cfg.fog);\n\n    const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 600);\n\n    // spine nodes (featured) = waypoint.lookAt ; camera vantages = waypoint.position\n    const S = waypoints.map(w => new THREE.Vector3().fromArray(w.lookAt));\n    const V = waypoints.map(w => new THREE.Vector3().fromArray(w.position));\n\n    // --- secondary nodes (ambient density, branch off interior spine nodes) ---\n    const secondary = [];\n    const secondaryParent = [];\n    const secondaryCount = Math.max(0, Math.round((M - 1) * cfg.secondaryPerNode));\n    for (let i = 0; i < secondaryCount; i++){\n      const parent = 1 + Math.floor(rng() * Math.max(1, M - 1));\n      const p = S[parent].clone();\n      const dir = S[Math.min(parent + 1, M - 1)].clone().sub(S[parent]);\n      if (dir.lengthSq() < 1e-4) dir.set(0, 0, -1);\n      dir.normalize();\n      let perp = new THREE.Vector3().crossVectors(dir, UP);\n      if (perp.lengthSq() < 1e-4) perp = new THREE.Vector3(1, 0, 0);\n      perp.normalize();\n      const up2 = new THREE.Vector3().crossVectors(dir, perp).normalize();\n      const ang = rng() * Math.PI * 2;\n      const r = 2.2 + rng() * 4.5;\n      p.addScaledVector(perp, Math.cos(ang) * r).addScaledVector(up2, Math.sin(ang) * r);\n      secondary.push(p);\n      secondaryParent.push(parent);\n    }\n\n    // --- recursive dendritic sub-network (Galton-Watson binary branching) ---\n    // Medical grounding (Vormberg et al., PLOS Comp Biol 2017): real dendrites are\n    // predominantly BINARY trees, statistically indistinguishable from a Galton-\n    // Watson random branching process (bifurcation ratio ~3.4-4), with segment\n    // length DECAY by branch order and MST/optimal-wiring spatial growth. So we\n    // grow a stochastic binary tree from each secondary node (the existing depth-1\n    // layer): at each tip, branch (mostly into 2) with probability subBranchProb\n    // until max depth; children step outward in a cone around the parent direction\n    // with length decaying by depth (Rall-like). Spine + secondary are untouched.\n    // These sub-nodes/filaments are AMBIENT (no camera stops) — they extend the\n    // network into a true neural mesh. Sway params (phase, amplitude) are assigned\n    // per node by depth so the wind-sway shader can bend filaments root->tip with\n    // endpoints that EXACTLY match node centers (no detachment): each tube vertex\n    // bakes a phase = lerp(rootNodePhase, tipNodePhase, u) and the node billboard\n    // uses its own phase, so a tube endpoint and its node share the same phase =>\n    // identical displacement. Direction is derived in-shader from the phase\n    // (deterministic) so every node/vertex sways in a unique direction with no\n    // extra attribute, and endpoints still match (same phase => same direction).\n    const depthAmp = [0, 0.12, 0.28, 0.42, 0.52, 0.58, 0.6]; // sway amplitude by depth (0 spine => fixed)\n    const nodeSway = [];      // per-node [phase, amp], indexed 0..totalNodes-1\n    const nodeDepthArr = [];  // per-node branch order\n    for (let i = 0; i < M; i++){ nodeSway.push([srand(i * 12.9 + 1.1) * Math.PI * 2, 0]); nodeDepthArr.push(0); }\n    for (let s = 0; s < secondary.length; s++){\n      nodeSway.push([srand((M + s) * 12.9 + 1.1) * Math.PI * 2, depthAmp[1]]); nodeDepthArr.push(1);\n    }\n    const subNodes = [];    // {pos, depth, parentIdx, origin}\n    const subCurves = [];   // {curve, originIdx, rootIdx, tipIdx, depth, t2}\n    // Shared Galton-Watson growth — used by BOTH tier 1's sub-network and tier 2's\n    // midground (same logic, same cfg values; only the SEEDING differs).\n    let nodeCursor = M + secondary.length; // global index of the next sub-node\n    function growGW(fronts, nodeCap, t2){\n      const maxD = cfg.subBranchDepth, baseLen = 2.6;\n      let guard = 0;\n      while (fronts.length && guard < 6000 && subNodes.length < nodeCap){\n        guard++;\n        const f = fronts.shift();\n        if (f.depth >= maxD) continue;\n        if (rng() > cfg.subBranchProb) continue;             // Galton-Watson: terminate this tip\n        const nChild = (rng() < 0.7) ? 2 : (rng() < 0.5 ? 1 : 3); // mostly binary (PLOS: predominantly binary)\n        const len = baseLen * Math.pow(cfg.subLenDecay, f.depth) * (0.7 + rng() * 0.6);\n        for (let c = 0; c < nChild; c++){\n          const spread = (0.5 + rng() * 0.9) * (0.6 + f.depth * 0.15);\n          let perp = new THREE.Vector3().crossVectors(f.dir, UP);\n          if (perp.lengthSq() < 1e-4) perp = new THREE.Vector3(1, 0, 0);\n          perp.normalize();\n          const up2 = new THREE.Vector3().crossVectors(f.dir, perp).normalize();\n          const a = rng() * Math.PI * 2, tilt = rng() * spread;\n          const dir = f.dir.clone().applyAxisAngle(perp, Math.sin(a) * tilt).applyAxisAngle(up2, Math.cos(a) * tilt).normalize();\n          const childPos = f.pos.clone().addScaledVector(dir, len);\n          const childIdx = nodeCursor++, childDepth = f.depth + 1;\n          subNodes.push({ pos: childPos, depth: childDepth, parentIdx: f.parentIdx, origin: f.origin });\n          nodeSway.push([srand(childIdx * 12.9 + 1.1) * Math.PI * 2, depthAmp[Math.min(childDepth, depthAmp.length - 1)]]);\n          nodeDepthArr.push(childDepth);\n          subCurves.push({ curve: makeCurve(f.pos, childPos, 5000 + subCurves.length), originIdx: f.origin, rootIdx: f.parentIdx, tipIdx: childIdx, depth: childDepth, t2 });\n          fronts.push({ pos: childPos, dir, depth: childDepth, parentIdx: childIdx, origin: f.origin });\n        }\n      }\n    }\n    // Tier 1: seed growth fronts from each secondary node (depth 1) so the\n    // recursion continues the hierarchy spine(0) -> secondary(1) -> sub(2) -> ...\n    // (unchanged behavior + rng order => identical output to before).\n    {\n      const fronts = [];\n      for (let s = 0; s < secondary.length; s++){\n        const p = S[secondaryParent[s]];\n        let d = secondary[s].clone().sub(p); if (d.lengthSq() < 1e-4) d.set(0, 0, -1); d.normalize();\n        fronts.push({ pos: secondary[s].clone(), dir: d, depth: 1, parentIdx: M + s, origin: secondaryParent[s] });\n      }\n      growGW(fronts, cfg.subMaxNodes, false);\n    }\n    // --- Tier 2 (midground): SAME growth logic, seeded from points scattered just\n    // outside the camera corridor with a SOFT smoothstep falloff (never a hard\n    // cut), at radii where tier 1's own sub-network already reaches — so tier 2\n    // reads as a continuation of tier 1's density, not a seam. Nodes/curves are\n    // appended to the same arrays => same tube builder, node billboards, nebula\n    // sampling, and fractional ambient-pulse pool as tier 1's twigs.\n    const distToSpine = (p) => {\n      let best = Infinity;\n      const ab = new THREE.Vector3(), ap = new THREE.Vector3(), q = new THREE.Vector3();\n      for (let i = 0; i < M - 1; i++){\n        ab.subVectors(S[i + 1], S[i]); ap.subVectors(p, S[i]);\n        const t = clamp(ap.dot(ab) / Math.max(ab.lengthSq(), 1e-6), 0, 1);\n        q.copy(S[i]).addScaledVector(ab, t);\n        best = Math.min(best, p.distanceTo(q));\n      }\n      return best;\n    };\n    {\n      const fronts = [];\n      let attempts = 0;\n      while (fronts.length < cfg.t2Seeds && attempts < cfg.t2Seeds * 60){\n        attempts++;\n        const segI = Math.floor(rng() * Math.max(1, M - 1));\n        const base = S[segI].clone().lerp(S[Math.min(segI + 1, M - 1)], rng());\n        const ang = rng() * Math.PI * 2, elev = (rng() - 0.5) * 1.6;\n        const dir = new THREE.Vector3(Math.cos(ang) * Math.cos(elev), Math.sin(elev), Math.sin(ang) * Math.cos(elev)).normalize();\n        const p = base.addScaledVector(dir, cfg.t2RadMin + rng() * (cfg.t2RadMax - cfg.t2RadMin));\n        // soft corridor: acceptance ramps 0 -> 1 across [inner, outer] => density\n        // TAPERS toward the camera path instead of cutting off geometrically.\n        if (rng() > smoothstep(cfg.corridorInner, cfg.corridorOuter, distToSpine(p))) continue;\n        let origin = 0, bd = Infinity;\n        for (let i = 0; i < M; i++){ const dd = p.distanceToSquared(S[i]); if (dd < bd){ bd = dd; origin = i; } }\n        const gi = nodeCursor++;\n        subNodes.push({ pos: p.clone(), depth: 1, parentIdx: origin, origin });\n        nodeSway.push([srand(gi * 12.9 + 1.1) * Math.PI * 2, depthAmp[1]]);\n        nodeDepthArr.push(1);\n        // Connector filament from the nearest spine node OUT to this seed, so the\n        // midground cluster reads as a BRANCH off the main trunk (tip -> branch ->\n        // trunk -> soma) rather than a tuft floating disconnected in space. Built\n        // with the same makeCurve + fed into the same tube/nebula/pulse machinery.\n        subCurves.push({ curve: makeCurve(S[origin], p, 8000 + gi), originIdx: origin, rootIdx: origin, tipIdx: gi, depth: 1, t2: true });\n        fronts.push({ pos: p.clone(), dir, depth: 1, parentIdx: gi, origin });\n      }\n      growGW(fronts, cfg.subMaxNodes + cfg.t2MaxNodes, true);\n    }\n\n    const totalNodes = M + secondary.length + subNodes.length;\n\n    // --- node instanced mesh ---\n    // Nodes = camera-facing glow quads (billboards) with a procedural radial gradient.\n    // This kills silhouette faceting ENTIRELY: the disk is always a perfectly round glow\n    // regardless of tessellation (no polygon outline to catch the eye under controlled bloom).\n    // Matches the hazy/nebula reference; 1 draw call via InstancedMesh; cheaper than lit spheres.\n    // AdditiveBlending + transparent + depthWrite:false is the canonical glow technique\n    // (Stemkoski \"Shader-Glow\" + SO additive-sprite). Per-instance color + size preserved.\n    // ShaderMaterial auto-injects instanceMatrix / instanceColor for InstancedMesh.\n    const nodeGeo = new THREE.PlaneGeometry(1, 1);\n    const nodeMat = new THREE.ShaderMaterial({\n      uniforms: {\n        uSizeScale:  { value: cfg.nodeSizeScale },   // world-space glow radius = 0.5 * instanceScale * uSizeScale (visual metaphor, sized for calm)\n        uCorePower:  { value: 2.5 },   // tight hot core\n        uHaloPower:  { value: 1.2 },   // broad soft halo -> alpha driver, smooth falloff to 0 at the disk edge\n        uCoreWhite:  { value: cfg.nodeCoreWhite },  // white-peak lowered for eye comfort; excitation still pushes toward white on fire\n        uBody:       { value: cfg.nodeBody },   // colored body brightness (dimmed baseline)\n        uFogDensity: { value: cfg.fog },\n        uSwayTime:   { value: 0 },\n        uSwayAmt:    { value: reducedMotion ? 0 : cfg.swayAmt },\n        uSwayFreq:   { value: cfg.swayFreq },\n        uTime:       { value: 0 },\n        uBreathAmt:  { value: reducedMotion ? 0 : 0.06 }, // soft scale breathing amplitude\n        uExciteAmt:  { value: 0.8 }, // how much arrival/departure excitation brightens+scales a node\n      },\n      vertexShader: `\n        varying vec2 vUv;\n        varying vec3 vColor;\n        varying float vViewDist;\n        varying float vExcite;\n        uniform float uSizeScale;\n        attribute float aSwayPhase;\n        attribute float aSwayAmp;\n        attribute float aBreathPhase;\n        attribute float aBreathFreq;\n        attribute float aExcite;\n        uniform float uSwayTime, uSwayAmt, uSwayFreq, uTime, uBreathAmt, uExciteAmt;\n        // Sway direction derived deterministically from the phase so every node\n        // sways in a unique direction with no extra attribute. A node and the\n        // filament endpoint sharing the same phase => same direction => the\n        // billboard never detaches from the wire tip. amp 0 (spine) => no sway.\n        vec3 swayDir(float ph){\n          return normalize(vec3(sin(ph * 2.1) + 0.30, cos(ph * 1.7) + 0.20, sin(ph * 3.3) + 0.40));\n        }\n        void main(){\n          vColor = instanceColor;\n          vExcite = aExcite; // per-instance excitation (set by the pulse system each frame)\n          // instance translation (world center of this node) + uniform scale from instanceMatrix\n          vec3 instanceCenter = (instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;\n          float instScale = length(instanceMatrix[0].xyz); // uniform scale column\n          // organic sway: bend the node center with its own phase/amp (matches filament tips)\n          instanceCenter += swayDir(aSwayPhase) * (aSwayAmp * uSwayAmt) * sin(uSwayTime * uSwayFreq + aSwayPhase);\n          // soft breathing: per-instance sinusoidal scale (desynced phase+freq => not mechanical).\n          // Plus an excitation boost when a signal pulse departs/arrives this node: a brief\n          // scale-up + brightness that decays each frame (set in the animate loop).\n          float breath = 1.0 + uBreathAmt * sin(uTime * aBreathFreq + aBreathPhase);\n          float scaleBoost = 1.0 + vExcite * uExciteAmt * 0.35;\n          // camera right/up in WORLD space = rows of the view matrix (billboard the quad)\n          vec3 camRight = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);\n          vec3 camUp    = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);\n          float size = instScale * uSizeScale * breath * scaleBoost;\n          vec3 worldPos = instanceCenter + (camRight * position.x + camUp * position.y) * size;\n          vec4 mvPos = viewMatrix * vec4(worldPos, 1.0);\n          vViewDist = length(mvPos.xyz); // camera-relative distance for fog\n          vUv = position.xy + 0.5;       // 0..1 across the quad\n          gl_Position = projectionMatrix * mvPos;\n        }\n      `,\n      fragmentShader: `\n        varying vec2 vUv;\n        varying vec3 vColor;\n        varying float vViewDist;\n        varying float vExcite;\n        uniform float uCorePower;\n        uniform float uHaloPower;\n        uniform float uCoreWhite;\n        uniform float uBody;\n        uniform float uFogDensity;\n        uniform float uExciteAmt;\n        void main(){\n          vec2 p = vUv - 0.5;\n          float d = length(p) * 2.0;     // 0 center -> 1 edge of the quad\n          if (d > 1.0) discard;          // round disk, not a square\n          float fall = 1.0 - d;\n          float core = pow(fall, uCorePower); // hot core (tight)\n          float halo = pow(fall, uHaloPower); // soft halo (broad) -> drives alpha\n          // Excitation: a signal arriving/departing makes the node briefly hotter +\n          // whiter (electrical \"firing\"). Widen the core and push the peak toward white.\n          float ex = vExcite * uExciteAmt;\n          core = min(core + ex * 0.5, 1.0);\n          vec3 hot  = mix(vColor, vec3(1.0), min(uCoreWhite + ex * 0.4, 0.95));\n          vec3 body = vColor * uBody;\n          vec3 col  = mix(body, hot, core);   // smooth body -> hot center\n          float alpha = halo * (1.0 + ex * 0.4);\n          // exp2 fog: distant glows fade into the near-black bg. Additive only adds, so fade\n          // by multiplying contribution (bg ~= fog color, so this matches FogExp2 on opaque).\n          float fog = 1.0 - exp(-uFogDensity * uFogDensity * vViewDist * vViewDist);\n          col   *= (1.0 - fog);\n          alpha *= (1.0 - fog);\n          gl_FragColor = vec4(col, alpha);\n        }\n      `,\n      transparent: true,\n      depthWrite: false,\n      depthTest: true,\n      blending: THREE.AdditiveBlending,\n      side: THREE.DoubleSide,\n    });\n    const nodeMesh = new THREE.InstancedMesh(nodeGeo, nodeMat, totalNodes);\n    nodeMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(totalNodes * 3), 3);\n    // Per-instance sway params (phase, amplitude) so the node billboard sways in\n    // sync with the filaments that attach to it (detachment-free). Both come from\n    // nodeSway[i]; spine nodes have amp 0 => fixed (the camera stop stays put).\n    nodeMesh.geometry.setAttribute('aSwayPhase', new THREE.InstancedBufferAttribute(new Float32Array(totalNodes), 1));\n    nodeMesh.geometry.setAttribute('aSwayAmp',   new THREE.InstancedBufferAttribute(new Float32Array(totalNodes), 1));\n    // Breathing (per-instance desynced phase+freq) + excitation (updated each frame by\n    // the pulse system when a signal departs/arrives this node => the node \"fires\").\n    nodeMesh.geometry.setAttribute('aBreathPhase', new THREE.InstancedBufferAttribute(new Float32Array(totalNodes), 1));\n    nodeMesh.geometry.setAttribute('aBreathFreq',  new THREE.InstancedBufferAttribute(new Float32Array(totalNodes), 1));\n    const aExciteAttr = new THREE.InstancedBufferAttribute(new Float32Array(totalNodes), 1);\n    nodeMesh.geometry.setAttribute('aExcite', aExciteAttr);\n    const exciteArr = aExciteAttr.array; // updated each frame in animate()\n    // Medical grounding (action potential): a neuron that fires enters an ABSOLUTE\n    // refractory period during which it is completely unresponsive to further input\n    // (voltage-gated Na+ channels are inactivated) -> this is what forces DISCRETE\n    // readable pulses instead of sustained near-max brightness on hub nodes that\n    // have many convergent filaments. Convergent inputs use a SATURATING combine\n    // (spatial/temporal summation plateaus, never grows unbounded): it doesn't matter\n    // whether 2 or 10 pulses arrive together past a point, the postsynaptic response\n    // saturates. fireNode is the SINGLE entry point for every depart/arrive boost.\n    const refractUntil = new Float32Array(totalNodes); // absolute-refractory gate (seconds)\n    function fireNode(idx, env, now){\n      if (idx < 0 || idx >= exciteArr.length) return;\n      if (now < refractUntil[idx]) return;                 // absolute refractory: ignore input\n      const w = env * 0.9;                                 // per-event input weight\n      const e = 1 - (1 - exciteArr[idx]) * (1 - w);         // saturating combine (plateaus <=1)\n      exciteArr[idx] = e;\n      if (e > 0.4) refractUntil[idx] = now + cfg.refractory; // crossed firing threshold -> refractory\n    }\n    const dummy = new THREE.Object3D();\n    const col = new THREE.Color();\n    const nodeColors = []; // per-node accent color so pulses can inherit their origin node's color\n    const secCount = secondary.length;\n    for (let i = 0; i < totalNodes; i++){\n      let pos, scale, accent, lift;\n      if (i < M){                       // spine (camera stops)\n        pos = S[i]; scale = 1.0 * (0.85 + rng() * 0.4); accent = rng() < 0.18 ? PALETTE.nodeAccent : PALETTE.node; lift = 1.15;\n      } else if (i < M + secCount){     // secondary (depth 1)\n        const s = i - M; pos = secondary[s]; scale = (0.4 + rng() * 0.5) * (0.85 + rng() * 0.4); accent = rng() < 0.12 ? PALETTE.nodeAccent : PALETTE.node; lift = 1.0;\n      } else {                          // recursive sub-network (depth >= 2): inherit the nearest spine\n        const n = subNodes[i - M - secCount];            // accent so a cyan soma's dendrite stays cyan\n        pos = n.pos; scale = (0.20 + rng() * 0.22) * Math.pow(0.82, n.depth); accent = null; lift = 1.0;\n      }\n      dummy.position.copy(pos);\n      dummy.scale.setScalar(scale);\n      dummy.updateMatrix();\n      nodeMesh.setMatrixAt(i, dummy.matrix);\n      if (accent == null) col.copy(nodeColors[subNodes[i - M - secCount].origin]).lerp(new THREE.Color(PALETTE.node), 0.15);\n      else col.setHex(accent);\n      col.multiplyScalar(lift);\n      nodeMesh.setColorAt(i, col);\n      nodeColors[i] = col.clone();\n      nodeMesh.geometry.attributes.aSwayPhase.array[i] = nodeSway[i][0];\n      nodeMesh.geometry.attributes.aSwayAmp.array[i]   = nodeSway[i][1];\n      // desynced breathing: each node gets a unique phase + slightly different freq\n      // (0.5..1.3 rad/s) so the population breathes organically, never in lockstep.\n      nodeMesh.geometry.attributes.aBreathPhase.array[i] = srand(i * 4.7 + 2.2) * Math.PI * 2;\n      nodeMesh.geometry.attributes.aBreathFreq.array[i]  = 0.5 + srand(i * 9.3 + 0.6) * 0.8;\n    }\n    nodeMesh.instanceMatrix.needsUpdate = true;\n    if (nodeMesh.instanceColor) nodeMesh.instanceColor.needsUpdate = true;\n    nodeMesh.geometry.attributes.aSwayPhase.needsUpdate = true;\n    nodeMesh.geometry.attributes.aSwayAmp.needsUpdate = true;\n    nodeMesh.geometry.attributes.aBreathPhase.needsUpdate = true;\n    nodeMesh.geometry.attributes.aBreathFreq.needsUpdate = true;\n    nodeMesh.renderOrder = 1; // additive node glows draw on top of filament tubes\n    scene.add(nodeMesh);\n\n    // --- connection curves (main axons through S) ---\n    const nodeConnCurves = [];\n    for (let i = 0; i < M - 1; i++){\n      nodeConnCurves.push({ curve: makeCurve(S[i], S[i + 1], i * 2 + 1), main: true });\n    }\n    const secondaryCurves = [];\n    for (let s = 0; s < secondary.length; s++){\n      secondaryCurves.push({ curve: makeCurve(S[secondaryParent[s]], secondary[s], 1000 + s), main: false });\n    }\n\n    // Per-spine-node list of MAIN-BRANCH curves that ORIGINATE at that node\n    // (getPointAt(0) == S[i] -> the pulse departs FROM the reached node).\n    // Forward axon S[i]->S[i+1] for interior/early nodes; the last node (no\n    // forward spine) falls back to the previous axon reversed (S[i]->S[i-1]).\n    // Node 0 is left empty (the trigger gate skips it: \"from the second node on\").\n    const origins = [];\n    for (let i = 0; i < M; i++){\n      const list = [];\n      if (i < M - 1) list.push({ curve: nodeConnCurves[i].curve, dir: 1 });\n      else if (i >= 1) list.push({ curve: nodeConnCurves[i - 1].curve, dir: -1 });\n      origins.push(list);\n    }\n\n    // Ambient-pulse pool: every filament (spine axon + secondary branch) is a\n    // candidate, tagged with its ORIGIN node index (getPointAt(0) == that node)\n    // so each pulse can inherit its origin node's accent color. Fisher-Yates\n    // shuffle => randomized coverage; pulseCoverage caps how many filaments carry\n    // a live pulse (1.0 = all filaments, each exactly once — avoids the old\n    // random-with-replacement issue where some curves got 2+ pulses and others 0).\n    const pulsePool = [];\n    for (let i = 0; i < nodeConnCurves.length; i++) pulsePool.push({ curve: nodeConnCurves[i].curve, origin: i, dest: i + 1, radius: cfg.tubeRadius });\n    for (let s = 0; s < secondaryCurves.length; s++) pulsePool.push({ curve: secondaryCurves[s].curve, origin: secondaryParent[s], dest: M + s, radius: cfg.tubeRadius * 0.7 });\n    // A FRACTION of the recursive sub-network twigs also carry an ambient pulse\n    // (origin = the twig's nearest spine node => pulse inherits that accent color),\n    // so the dense sub-mesh reads as alive without a pulse on every twig (which\n    // would be visually noisy). subPulseFrac governs the fraction.\n    const subPulseCount = Math.floor(subCurves.length * cfg.subPulseFrac);\n    const subPulseShuf = subCurves.slice();\n    for (let i = subPulseShuf.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); const t = subPulseShuf[i]; subPulseShuf[i] = subPulseShuf[j]; subPulseShuf[j] = t; }\n    for (let i = 0; i < subPulseCount; i++) pulsePool.push({ curve: subPulseShuf[i].curve, origin: subPulseShuf[i].originIdx, dest: subPulseShuf[i].tipIdx, radius: cfg.tubeRadius * 0.5 * Math.pow(0.8, subPulseShuf[i].depth), irregular: !!subPulseShuf[i].t2 });\n    for (let i = pulsePool.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); const t = pulsePool[i]; pulsePool[i] = pulsePool[j]; pulsePool[j] = t; }\n    const pulseCount = Math.max(1, Math.floor(pulsePool.length * cfg.pulseCoverage));\n\n    // --- merged tube mesh (single draw call) ---\n    // Attach per-vertex curve-tangent + sway params so the filament shader can\n    // detect axial (down-the-barrel) views AND bend organically. Sway is baked as\n    // a per-vertex phase + amplitude = lerp(rootNodeSway, tipNodeSway, u). The\n    // root vertex (u=0) gets the parent node's (phase,amp) and the tip vertex\n    // (u=1) gets the child node's — so a tube endpoint and its node share the\n    // exact same sway params => identical displacement => NO detachment, while\n    // the branch bends between them (amp grows root->tip). Spine axons connect\n    // two amp-0 spine nodes => no sway (camera path stays stable).\n    // TubeGeometry lays out verts as (tub+1)*(rad+1); tangent + sway are\n    // constant across each ring, sampled at u = i/tub.\n    function tubeWithTangent(curve, tubSeg, radius, radSeg, rootSway, tipSway){\n      const g = new THREE.TubeGeometry(curve, tubSeg, radius, radSeg, false);\n      const rad = radSeg + 1;\n      const n = (tubSeg + 1) * rad;\n      const arr = new Float32Array(n * 3);\n      const ph = new Float32Array(n);\n      const am = new Float32Array(n);\n      const rP = rootSway[0], rA = rootSway[1], tP = tipSway[0], tA = tipSway[1];\n      for (let i = 0; i <= tubSeg; i++){\n        const u = tubSeg === 0 ? 0 : i / tubSeg;\n        const t = curve.getTangentAt(u); // normalized THREE.Vector3 (arc-length uniform, matches TubeGeometry frames)\n        const sp = rP + (tP - rP) * u;   // lerp phase root->tip\n        const sa = rA + (tA - rA) * u;   // lerp amplitude root->tip (grows => branch bends)\n        for (let j = 0; j <= radSeg; j++){\n          const idx = (i * rad + j) * 3;\n          arr[idx] = t.x; arr[idx + 1] = t.y; arr[idx + 2] = t.z;\n          ph[i * rad + j] = sp;\n          am[i * rad + j] = sa;\n        }\n      }\n      g.setAttribute('tangent', new THREE.BufferAttribute(arr, 3));\n      g.setAttribute('aSwayPhase', new THREE.BufferAttribute(ph, 1));\n      g.setAttribute('aSwayAmp', new THREE.BufferAttribute(am, 1));\n      return g;\n    }\n    const tubeGeos = [];\n    for (let i = 0; i < nodeConnCurves.length; i++){\n      const seg = Math.max(8, Math.floor(cfg.tubeSeg));\n      tubeGeos.push(tubeWithTangent(nodeConnCurves[i].curve, seg, cfg.tubeRadius, cfg.tubeRad, nodeSway[i], nodeSway[i + 1]));\n    }\n    for (let s = 0; s < secondaryCurves.length; s++){\n      const seg = Math.max(12, Math.floor(cfg.tubeSeg * 0.8));\n      tubeGeos.push(tubeWithTangent(secondaryCurves[s].curve, seg, cfg.tubeRadius * 0.7, cfg.tubeRad,\n        nodeSway[secondaryParent[s]], nodeSway[M + s]));\n    }\n    for (let c = 0; c < subCurves.length; c++){\n      const sc = subCurves[c];\n      // More tubular segments than before: the multi-waypoint CatmullRom meanders,\n      // so a low-seg tube cuts corners and the (true-curve) pulse would appear to\n      // leave the visible filament on bends. Scale by depth so deep short twigs\n      // stay light while shallow long branches resolve their wander. Still one\n      // merged draw call; verts stay well inside the desktop headroom.\n      const seg = Math.max(10, Math.floor(cfg.tubeSeg * 0.55 * Math.pow(0.85, sc.depth)));\n      const rad = Math.max(3, Math.floor(cfg.tubeRad * 0.6));\n      tubeGeos.push(tubeWithTangent(sc.curve, seg, cfg.tubeRadius * 0.5 * Math.pow(0.8, sc.depth), rad,\n        nodeSway[sc.rootIdx], nodeSway[sc.tipIdx]));\n    }\n    const tubeGeo = mergeGeometries(tubeGeos, false);\n    tubeGeos.forEach(g => g.dispose());\n    // Filament shader: view-angle falloff on tube normals -> luminous core\n    // (facing the camera) fading to a dull silhouette edge. TubeGeometry emits\n    // smooth outward normals, so dot(N,viewDir) is high at the visible center\n    // line and ~0 at the rounded tubeMesh has no transform => object space == world space; displace the\n          // vertex by its baked sway (phase+amp lerp root->tip) before the view xform.\n          // Endpoints (u=0/u=1) carry the parent/child node's exact sway params, so\n          // the wire tip meets the swaying node with no gap.\n          vec3 swayed = position + swayDir(aSwayPhase) * (aSwayAmp * uSwayAmt) * sin(uSwayTime * uSwayFreq + aSwayPhase);\n          vec4 mv = modelViewMatrix * vec4(swayed, 1.0);\n          vNormal = normalize(normalMatrix * normal);\n          vViewDir = normalize(-mv.xyz);\n          vFogDepth = -mv.z;\n          vec3 vt = normalize(normalMatrix * tangent);\n          vAxial = abs(dot(vt, vViewDir));\n          vTubeU = uv.y;          // 0->1 along the filament length (TubeGeometry uv)\n          gl_Position = projectionMatrix * mv;\n        }\n      `,\n      fragmentShader: `\n        uniform vec3 uColorDim;\n        uniform vec3 uColorCore;\n        uniform float uCorePower;\n        uniform float uAxialFloor;\n        uniform vec3 uFogColor;\n        uniform float uFogDensity;\n        uniform float uTime;\n        uniform float uShimmer;\n        varying vec3 vNormal;\n        varying vec3 vViewDir;\n        varying float vFogDepth;\n        varying float vAxial;\n        varying float vTubeU;\n        void main(){\n          float facing = max(dot(normalize(vNormal), normalize(vViewDir)), 0.0);\n          float core = pow(facing, uCorePower);\n          core = max(core, uAxialFloor * vAxial);\n          // Myelin / bioconductive shimmer: a slow traveling brightness wave along\n          // the filament length (uv.y). Evokes segmented myelin internodes + the\n          // \"living wire\" feel of action-potential conduction. Subtle (uShimmer<0.3)\n          // so it never competes with the node glow or blooms into noise.\n          float shimmer = 1.0 + uShimmer * sin(vTubeU * 9.0 - uTime * 1.4);\n          core *= shimmer;\n          vec3 col = mix(uColorDim, uColorCore, core);\n          float a = mix(0.18, 0.9, core);\n          float fogF = 1.0 - exp(-uFogDensity * uFogDensity * vFogDepth * vFogDepth);\n          col = mix(col, uFogColor, fogF);\n          a *= (1.0 - fogF);\n          gl_FragColor = vec4(col, a);\n        }\n      `,\n      transparent: true, depthWrite: false,\n      blending: THREE.AdditiveBlending,\n    });\n    const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);\n    scene.add(tubeMesh);\n\n    // --- neuropil background field (Step 4) ---\n    // Not a starfield: a continuation of the existing network outward. Neuroscience\n    // grounding: somas (nodes) are SPARSE bright points (~16-79k/mm3); the inter-soma\n    // space is NEUROPIL, a saturated felt of fine processes (up to 9km fiber/mm3),\n    // roughly UNIFORM density, slightly denser near fiber bundles, thinner at edges.\n    // Human neurons grow longer dendrites to MAINTAIN that fill despite wider soma\n    // spacing. So the goal = uniform-ish low-contrast haze hugging the filaments,\n    // sparse bright nodes against it, NOT a void and NOT a bright blob.\n    // 60% of points hug filaments (denser bundles), 40% fill inter-filament gaps near\n    // spine nodes (diffuse uniform fill); each point inherits its nearest node's\n    // accent color so it reads as the SAME tissue expanding outward, not a separate\n    // starfield. THREE.Points = 1 draw call regardless of count; all drift on GPU.\n    let nebulaMesh = null;\n    // Stateful nebula mouse-interaction sim (fluid hand-in-liquid): per-particle CPU\n    // spring-damper. nebRest = spring target (original sampled pos), nebVel = velocities,\n    // nebSettled = idle flag (skips the loop + upload when nothing is moving -> mobile perf).\n    let nebRest = null, nebVel = null, nebNP = 0, nebSim = false, nebSettled = true;\n    if (cfg.nebulaPoints > 0){\n      const nebCurves = [];\n      for (let i = 0; i < nodeConnCurves.length; i++) nebCurves.push({ curve: nodeConnCurves[i].curve, origin: i });\n      for (let s = 0; s < secondaryCurves.length; s++) nebCurves.push({ curve: secondaryCurves[s].curve, origin: secondaryParent[s] });\n      // Include the recursive sub-network so the neuropil tissue hugs the full\n      // dendritic mesh, not just the spine + first branches (origin = nearest\n      // spine node => inherits that accent tint).\n      for (let c = 0; c < subCurves.length; c++) nebCurves.push({ curve: subCurves[c].curve, origin: subCurves[c].originIdx });\n      // Irwin-Hall (sum of 3 uniforms, centered) -> mild gaussian, deterministic via rng.\n      const gauss = () => (rng() + rng() + rng() - 1.5) * 1.4;\n      const nP = cfg.nebulaPoints;\n      const pos = new Float32Array(nP * 3);\n      const col = new Float32Array(nP * 3);\n      const drift = new Float32Array(nP * 3);\n      const phase = new Float32Array(nP);\n      const sz = new Float32Array(nP);\n      const tmpC = new THREE.Color();\n      const tubeTint = new THREE.Color(PALETTE.tube);\n      const _np = new THREE.Vector3();\n      for (let i = 0; i < nP; i++){\n        let origin, bx, by, bz;\n        if (rng() < 0.6 && nebCurves.length){\n          // hug a filament: gaussian around a random curve point (denser bundle)\n          const c = nebCurves[(rng() * nebCurves.length) | 0];\n          c.curve.getPointAt(rng(), _np);\n          origin = c.origin;\n          const sp = cfg.nebulaSpread * 0.5 * (0.4 + rng() * 0.8);\n          bx = _np.x + gauss() * sp; by = _np.y + gauss() * sp; bz = _np.z + gauss() * sp;\n        } else {\n          // fill inter-filament gaps: wider gaussian around a random spine node\n          const ni = (rng() * M) | 0;\n          const p = S[ni];\n          origin = ni;\n          const sp = cfg.nebulaSpread * 1.2 * (0.5 + rng() * 0.7);\n          bx = p.x + gauss() * sp; by = p.y + gauss() * sp; bz = p.z + gauss() * sp;\n        }\n        pos[i*3] = bx; pos[i*3+1] = by; pos[i*3+2] = bz;\n        // inherit nearest node accent color
