name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck · test · corpus · knip · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` needs package-lock.json. It was missing from the repo for the
      # whole of the project's life — see the docker job below.
      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      # The corpus is the source of truth for every factual claim on the site.
      # `prebuild` runs this too; it runs here first so a corpus failure reports
      # as itself instead of as a build failure.
      - name: corpus:check
        run: npm run corpus:check

      # NOTE: package.json declares `knip --no-exit-code`, so this step reports
      # dead files, exports and dependencies but cannot fail the job. Switch the
      # script to a gating `knip` once the existing dead-code backlog is cleared
      # — until then a green tick here does not mean clean.
      - name: knip
        run: npm run knip

      - name: build
        run: npm run build

  docker:
    # The Docker build had never once succeeded: Dockerfile:5 ran `npm ci` with no
    # package-lock.json in the repo. Nothing built the image in CI, so nobody found
    # out. This job is that missing step. It is not optional.
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build .
