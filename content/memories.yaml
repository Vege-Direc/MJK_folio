- id: contact-how-it-starts
  section: contact
  stopId: contact
  title: How an engagement starts
  tags: [contact, engagement, process, availability, scoping, capacity, proposal, start]
  body: >
    Tell me the problem, when you need it, and what has been tried. I come back within a day with
    either a scoped proposal or an honest "not the right fit", and I say no about as often as yes.
    Scope and start date depend on what you need and what I am already carrying, so ask and I will
    tell you straight rather than guess in public. Most engagements begin as one automation and turn
    into the system around it.
