- id: arc-aircraft-to-agents
  section: story
  stopId: origin
  title: The arc, compressed
  tags: [origin, aerospace, ai, pivot]
  period: 2010-2026
  body: >
    I dreamt of flying fighters. Trained to design aircraft — mechanical engineering at BITS Pilani in
    Dubai in 2010, then an aerospace masters at Brunel in London in 2012. The UK aerospace market wasn't
    hiring by the time I finished. So I rebuilt the toolkit. Media strategy at Omnicom in India from
    2013, then Kinnect, Hotstar, Taboola, and eventually Singapore. Now I'm building the systems that do
    that work faster and better than any team I ever ran.

- id: pattern-imagine-then-learn
  section: story
  stopId: pivot
  title: The pattern
  tags: [method, imagination, learning]
  body: >
    First I imagine it. Then I learn whatever it takes to build it. That's the loop that shows up in
    everything — a cafe racer from an RD350, a chat-native ERP, a multi-agent creative pipeline for
    jewellery, a website that behaves like a mind.

- id: project-jewel-ai
  section: projects
  stopId: now
  title: JewelAI Studio
  tags: [ai, agents, creative, langgraph]
  body: >
    A multi-agent creative pipeline that turns product photography and briefs into finished ad creatives
    for jewellery brands. LangGraph orchestration, custom retouching agents, brand-voice guardrails.

- id: project-mrunn-erp
  section: projects
  stopId: now
  title: MruNN-ERP — chat-native ERP
  tags: [ai, ops, mastra, agents]
  body: >
    An ERP you talk to. Purchase orders, invoices, stock queries — all through a Mastra multi-agent
    system that also renders traditional forms when they're the right tool. Built because every ERP I've
    used forces the human to translate their intent into a form.

- id: project-taboola
  section: projects
  stopId: work
  title: Taboola product work
  tags: [product, payments, security, apac]
  period: 2020-2021
  body: >
    Media Product Specialist at Taboola, based in Thailand. I led product rollouts including
    emerging-market payment expansion into Korea and Indonesia, the APAC Ads Interface revamp, and a
    global two-factor authentication launch. I also ran beta programs with product and account teams
    and built the training that took it all to sales and clients across APAC.

- id: project-kinnect-automation
  section: projects
  stopId: apac
  title: Kinnect reporting automation
  tags: [engineering-inside-marketing, automation, origin]
  period: 2017-2019
  body: >
    The origin of the engineer-inside-the-marketer. Kinnect's reporting was manual, so I automated it
    with Supermetrics and Looker Studio and cut report generation time by half. I also grew the media
    team from two to five. This is when I realised the marketing job was really a systems job in
    disguise.

- id: cap-paid-media
  section: capabilities
  stopId: apac
  title: Paid media
  tags: [media, apac, india]
  body: >
    A decade of performance and brand media, first across India, then Southeast Asia. Hindustan Unilever,
    Parle, Tourism Australia and Visa at Omnicom. Skechers, Rustomjee and Lodha at Kinnect. Canon, Evian
    and The Laughing Cow at The Triad Co. 5x ROAS for Evian; a 10x increase in ad spend on Rustomjee's
    first project.

- id: cap-ai-agents
  section: capabilities
  stopId: now
  title: AI agents
  tags: [ai]
  body: Mastra, LangGraph, Vercel AI SDK. Multi-agent systems for ERP, creative pipelines, and this site.

- id: cap-full-stack
  section: capabilities
  stopId: now
  title: Full-stack builds
  tags: [engineering]
  body: Next.js, TypeScript, R3F, Postgres, Redis. From marketing automations to production ERPs.

- id: contact-brief
  section: contact
  stopId: contact
  title: How to brief me
  tags: [cta]
  body: >
    Tell me what you're working on, when you need it, and what's tried already. I'll come back within a day
    with a scoped proposal or an honest "not the right fit."

